name: Coinoskobi CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: coinoskobi-ci-${{ github.ref }}
  cancel-in-progress: true

# Full regression is opt-in by commit marker after a coherent
# production package has already passed the canonical smoke/E2E gate.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Canonical smoke and E2E
        run: >-
          python -m pytest -q
          tests/test_runtime_market_flow.py
          tests/test_pipeline_real_actor_binding.py
          tests/test_origin_participation_binding.py
          tests/test_origin_participation_admission_integration.py
          tests/test_vur_kac_entry_admission.py
          tests/test_catastrophic_gap_calibration.py
          tests/test_true_composition_root_e2e.py
          tests/test_open_position_hot_path.py
          tests/test_application_market_flow_binding.py
          tests/test_application_dynamic_wss_pairs.py
          tests/test_application_paper_lifecycle.py

  full:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[full]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression
        run: python -m pytest -q
