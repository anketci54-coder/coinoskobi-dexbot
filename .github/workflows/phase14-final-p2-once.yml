name: Phase 14 final P2 repair once

on:
  push:
    branches:
      - phase14/panel-baseline-full-regression

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14/panel-baseline-full-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply final bounded Phase 14 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ANCHOR_MISMATCH:{path}:{count}:{old[:80]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          canonical = 'app/api/static/panel-canonical.js'
          replace_once(
              canonical,
              "async function submitOrder(){const o=state.order;if(!o)return;const btn=$('confirmOrder');",
              "async function submitOrder(){const o=state.order;if(!o||!state.dashboard){if(o)closeTicket();return}const btn=$('confirmOrder');",
          )
          replace_once(
              canonical,
              "state.dashboard=d.status==='fulfilled'?d.value:null;state.universe=u.status==='fulfilled'?u.value:null;",
              "state.dashboard=d.status==='fulfilled'?d.value:null;if(!state.dashboard)closeTicket();state.universe=u.status==='fulfilled'?u.value:null;",
          )

          acceptance = 'app/api/static/panel-canonical-acceptance.js'
          helper = '''  function accountingSummary(rows, dashboardSummary = {}) {\n    const statuses = rows.map(row => String(row?.status || '').toUpperCase());\n    const statusKnown = statuses.every(status => status === 'OPEN' || status === 'CLOSED');\n    const openRows = rows.filter((_, index) => statuses[index] === 'OPEN');\n    const openAmounts = openRows.map(row => num(row?.entry_amount_usdt ?? row?.amount_usdt));\n    const pnlValues = rows.map(row => num(row?.net_pnl_usdt ?? row?.net_pnl));\n    const openCount = statusKnown ? openRows.length : null;\n    const openInvestment = statusKnown && openAmounts.every(value => value !== null)\n      ? openAmounts.reduce((sum, value) => sum + value, 0)\n      : null;\n    const totalPnl = pnlValues.every(value => value !== null)\n      ? pnlValues.reduce((sum, value) => sum + value, 0)\n      : null;\n    const startingCapital = num(dashboardSummary.starting_capital);\n    const equity = startingCapital !== null && totalPnl !== null\n      ? startingCapital + totalPnl\n      : null;\n\n    return {\n      equity,\n      total_pnl: totalPnl,\n      open_count: openCount,\n      open_investment: openInvestment\n    };\n  }\n\n'''
          replace_once(
              acceptance,
              '  async function showAccounting() {\n',
              helper + '  async function showAccounting() {\n',
          )
          replace_once(
              acceptance,
              '      const summary = dashboard.summary || {};\n',
              '      const summary = accountingSummary(rows, dashboard.summary || {});\n',
          )

          html = 'app/api/static/index.html'
          replace_once(html, '/static/panel-canonical-acceptance.js?v=3', '/static/panel-canonical-acceptance.js?v=4')
          replace_once(html, '/static/panel-canonical.js?v=2', '/static/panel-canonical.js?v=3')

          fresh = Path('tests/test_panel_fresh_snapshot.py')
          text = fresh.read_text(encoding='utf-8')
          text = text.replace(
              'assert "/static/panel-canonical.js?v=2" in html\n    assert "/static/panel-canonical-acceptance.js?v=3" in html\n    assert "/static/panel-canonical.js?v=1" not in html\n    assert "/static/panel-canonical-acceptance.js?v=2" not in html',
              'assert "/static/panel-canonical.js?v=3" in html\n    assert "/static/panel-canonical-acceptance.js?v=4" in html\n    assert "/static/panel-canonical.js?v=2" not in html\n    assert "/static/panel-canonical-acceptance.js?v=3" not in html',
          )
          marker = 'def test_changed_panel_assets_have_new_cache_keys():'
          if marker not in text:
              raise SystemExit('FRESH_CACHE_TEST_MARKER_MISSING')
          extra = '''\n\ndef test_dashboard_failure_closes_and_blocks_open_manual_ticket():\n    js = JS.read_text(encoding="utf-8")\n\n    assert "if(!state.dashboard)closeTicket()" in js\n    assert "if(!o||!state.dashboard){if(o)closeTicket();return}" in js\n'''
          if 'test_dashboard_failure_closes_and_blocks_open_manual_ticket' not in text:
              text += extra
          fresh.write_text(text, encoding='utf-8')

          accounting = Path('tests/test_panel_accounting_visibility.py')
          text = accounting.read_text(encoding='utf-8')
          extra = '''\n\ndef test_accounting_kpis_are_derived_from_complete_paginated_ledger():\n    js = ACCEPTANCE.read_text(encoding="utf-8")\n\n    assert "function accountingSummary(rows, dashboardSummary = {})" in js\n    assert "const openRows = rows.filter" in js\n    assert "row?.entry_amount_usdt ?? row?.amount_usdt" in js\n    assert "row?.net_pnl_usdt ?? row?.net_pnl" in js\n    assert "const summary = accountingSummary(rows, dashboard.summary || {})" in js\n    assert "const summary = dashboard.summary || {}" not in js\n'''
          if 'test_accounting_kpis_are_derived_from_complete_paginated_ledger' not in text:
              text += extra
          accounting.write_text(text, encoding='utf-8')

          canonical_test = Path('tests/test_panel_canonical_final.py')
          text = canonical_test.read_text(encoding='utf-8')
          old = 'assert "/static/panel-canonical.js?v=2" in html'
          if text.count(old) != 1:
              raise SystemExit(f'CANONICAL_VERSION_TEST_ANCHOR={text.count(old)}')
          canonical_test.write_text(text.replace(old, 'assert "/static/panel-canonical.js?v=3" in html', 1), encoding='utf-8')

          acceptance_test = Path('tests/test_panel_acceptance_frontend.py')
          text = acceptance_test.read_text(encoding='utf-8')
          old = 'assert "/static/panel-canonical-acceptance.js?v=3" in html'
          if text.count(old) != 1:
              raise SystemExit(f'ACCEPTANCE_VERSION_TEST_ANCHOR={text.count(old)}')
          acceptance_test.write_text(text.replace(old, 'assert "/static/panel-canonical-acceptance.js?v=4" in html', 1), encoding='utf-8')
          PY
      - name: Static and syntax guards
        run: |
          git diff --check
          node --check app/api/static/panel-canonical.js
          node --check app/api/static/panel-canonical-acceptance.js
      - name: Focused regression
        run: >-
          python -m pytest -q
          tests/test_panel_accounting_visibility.py
          tests/test_panel_fresh_snapshot.py
          tests/test_panel_canonical_final.py
          tests/test_panel_acceptance_frontend.py
          tests/test_panel_manual_paper_v2.py
          tests/test_panel_operations.py
      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/phase14-final-p2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/static/index.html app/api/static/panel-canonical.js app/api/static/panel-canonical-acceptance.js tests/test_panel_accounting_visibility.py tests/test_panel_fresh_snapshot.py tests/test_panel_canonical_final.py tests/test_panel_acceptance_frontend.py
          git diff --cached --check
          git commit -m "fix: close final Phase 14 panel review findings"
          git push origin HEAD:phase14/panel-baseline-full-regression
