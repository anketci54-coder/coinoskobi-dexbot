name: Phase 14 P2 repair final

on:
  push:
    branches:
      - phase14/panel-baseline-full-regression

permissions:
  contents: write

jobs:
  repair-final:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14/panel-baseline-full-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply validated repair and align stale canonical test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase14-p2-repair-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'phase14_p2_repair.py', 'exec'), {})

          p = Path('tests/test_panel_canonical_final.py')
          text = p.read_text(encoding='utf-8')
          old = 'assert "/static/panel-canonical.js?v=1" in html'
          new = 'assert "/static/panel-canonical.js?v=2" in html'
          if text.count(old) != 1:
              raise SystemExit(f'CANONICAL_CACHE_TEST_ANCHOR={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Static and syntax guards
        run: |
          git diff --check
          python -m py_compile app/api/panel.py
          node --check app/api/static/panel-canonical.js
          node --check app/api/static/panel-canonical-acceptance.js
      - name: Focused regression
        run: >-
          python -m pytest -q
          tests/test_panel_accounting_visibility.py
          tests/test_panel_fresh_snapshot.py
          tests/test_panel_canonical_final.py
          tests/test_panel_manual_paper_v2.py
          tests/test_panel_operations.py
      - name: Commit validated repair and remove one-shot workflows
        shell: bash
        run: |
          git rm .github/workflows/phase14-p2-repair-once.yml .github/workflows/phase14-p2-repair-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/panel.py app/api/static/index.html app/api/static/panel-canonical.js app/api/static/panel-canonical-acceptance.js tests/test_panel_accounting_visibility.py tests/test_panel_fresh_snapshot.py tests/test_panel_canonical_final.py
          git diff --cached --check
          git commit -m "fix: close Phase 14 panel P2 findings"
          git push origin HEAD:phase14/panel-baseline-full-regression
