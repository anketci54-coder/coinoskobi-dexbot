name: Phase 9 degraded retry repair once

on:
  push:
    branches:
      - phase9/successful-wallet-outcome-feed

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9/successful-wallet-outcome-feed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply bounded degraded retry repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ANCHOR_MISMATCH:{path}:{count}:{old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          outcome = 'app/learning/runtime_outcome_feed.py'

          replace_once(
              outcome,
              '        self._events = OrderedDict()\n\n        self.memory = OutcomeMemory(\n',
              '        self._events = OrderedDict()\n        self._phase9_retries = OrderedDict()\n        self.max_phase9_retries = self.max_events\n\n        self.memory = OutcomeMemory(\n',
          )

          old_duplicate = '''            if (\n                isinstance(phase9, dict)\n                and phase9.get("state") == "DEGRADED"\n            ):\n                existing[\n                    "phase9_wallet_tracking"\n                ] = self._observe_phase9_wallet_outcome(\n                    position_id=position_id,\n                    opening_context=opening_context,\n                    realized_return=realized_return,\n                    evidence_complete=bool(\n                        observed_at\n                        and evaluated_at\n                        and token\n                        and realized_return is not None\n                    ),\n                )\n\n            return self._out(\n'''
          new_duplicate = '''            if (\n                isinstance(phase9, dict)\n                and phase9.get("state") == "DEGRADED"\n            ):\n                retry_result = self._observe_phase9_wallet_outcome(\n                    position_id=position_id,\n                    opening_context=opening_context,\n                    realized_return=realized_return,\n                    evidence_complete=bool(\n                        observed_at\n                        and evaluated_at\n                        and token\n                        and realized_return is not None\n                    ),\n                )\n                existing[\n                    "phase9_wallet_tracking"\n                ] = retry_result\n\n                if (\n                    isinstance(retry_result, dict)\n                    and retry_result.get("state") == "DEGRADED"\n                ):\n                    self._remember_phase9_retry(\n                        outcome_id=outcome_id,\n                        position_id=position_id,\n                        opening_context=opening_context,\n                        realized_return=realized_return,\n                        evidence_complete=bool(\n                            observed_at\n                            and evaluated_at\n                            and token\n                            and realized_return is not None\n                        ),\n                    )\n                else:\n                    self._phase9_retries.pop(\n                        outcome_id,\n                        None,\n                    )\n\n            return self._out(\n'''
          replace_once(outcome, old_duplicate, new_duplicate)

          replace_once(
              outcome,
              '''        self._events[\n            outcome_id\n        ] = row\n\n        while (\n''',
              '''        self._events[\n            outcome_id\n        ] = row\n\n        if (\n            isinstance(phase9_wallet_tracking, dict)\n            and phase9_wallet_tracking.get("state") == "DEGRADED"\n        ):\n            self._remember_phase9_retry(\n                outcome_id=outcome_id,\n                position_id=position_id,\n                opening_context=opening_context,\n                realized_return=realized["return"],\n                evidence_complete=evidence_complete,\n            )\n\n        while (\n''',
          )

          replace_once(
              outcome,
              '''            self._events.popitem(\n                last=False\n            )\n\n            self.dropped_count += 1\n''',
              '''            dropped_id, _ = self._events.popitem(\n                last=False\n            )\n            self._phase9_retries.pop(\n                dropped_id,\n                None,\n            )\n\n            self.dropped_count += 1\n''',
          )

          retry_methods = '''    @property\n    def phase9_retry_count(self):\n        return len(self._phase9_retries)\n\n    def _remember_phase9_retry(\n        self,\n        *,\n        outcome_id,\n        position_id,\n        opening_context,\n        realized_return,\n        evidence_complete,\n    ):\n        self._phase9_retries[outcome_id] = {\n            "position_id": position_id,\n            "opening_context": opening_context,\n            "realized_return": realized_return,\n            "evidence_complete": evidence_complete,\n        }\n        self._phase9_retries.move_to_end(\n            outcome_id\n        )\n\n        while (\n            len(self._phase9_retries)\n            > self.max_phase9_retries\n        ):\n            self._phase9_retries.popitem(\n                last=False\n            )\n\n    def retry_degraded_wallet_outcomes(\n        self,\n        *,\n        limit=8,\n    ):\n        try:\n            bounded_limit = max(\n                1,\n                min(\n                    64,\n                    int(limit),\n                ),\n            )\n        except (TypeError, ValueError):\n            bounded_limit = 8\n\n        outcome_ids = list(\n            self._phase9_retries.keys()\n        )[:bounded_limit]\n        results = []\n\n        for outcome_id in outcome_ids:\n            retry = self._phase9_retries.get(\n                outcome_id\n            )\n            row = self._events.get(\n                outcome_id\n            )\n\n            if (\n                not isinstance(retry, dict)\n                or not isinstance(row, dict)\n            ):\n                self._phase9_retries.pop(\n                    outcome_id,\n                    None,\n                )\n                continue\n\n            phase9 = self._observe_phase9_wallet_outcome(\n                position_id=retry.get("position_id"),\n                opening_context=retry.get("opening_context"),\n                realized_return=retry.get("realized_return"),\n                evidence_complete=bool(\n                    retry.get("evidence_complete")\n                ),\n            )\n            row[\n                "phase9_wallet_tracking"\n            ] = phase9\n            results.append({\n                "state": "PHASE9_RETRY",\n                "outcome_id": outcome_id,\n                "phase9_wallet_tracking": dict(phase9),\n                "decision_authority": False,\n                "execution_authority": False,\n            })\n\n            if (\n                isinstance(phase9, dict)\n                and phase9.get("state") == "DEGRADED"\n            ):\n                self._phase9_retries.move_to_end(\n                    outcome_id\n                )\n            else:\n                self._phase9_retries.pop(\n                    outcome_id,\n                    None,\n                )\n\n        return results\n\n'''
          replace_once(
              outcome,
              '    def _observe_phase9_wallet_outcome(\n',
              retry_methods + '    def _observe_phase9_wallet_outcome(\n',
          )

          replace_once(
              outcome,
              '''            "dropped_count": (\n                self.dropped_count\n            ),\n            "bounded": True,\n''',
              '''            "dropped_count": (\n                self.dropped_count\n            ),\n            "phase9_retry_count": (\n                self.phase9_retry_count\n            ),\n            "max_phase9_retries": (\n                self.max_phase9_retries\n            ),\n            "bounded": True,\n''',
          )

          manager = 'app/paper/manager.py'
          replace_once(
              manager,
              '''        results = []\n\n        for pos in reader(\n''',
              '''        results = []\n\n        retry_degraded = getattr(\n            feed,\n            "retry_degraded_wallet_outcomes",\n            None,\n        )\n\n        if callable(retry_degraded):\n            try:\n                results.extend(\n                    retry_degraded(\n                        limit=8\n                    )\n                )\n            except Exception:\n                logger.exception(\n                    "Phase 9 wallet outcome retry failed"\n                )\n\n        for pos in reader(\n''',
          )

          runtime_test = Path('tests/test_runtime_outcome_feed.py')
          text = runtime_test.read_text(encoding='utf-8')
          extra = '''\n\ndef test_degraded_phase9_retry_queue_survives_multiple_scheduler_passes():\n    calls = []\n\n    def observer(wallet_id, outcome_id, return_pct, *, realized=False):\n        calls.append((wallet_id, outcome_id, return_pct, realized))\n        if len(calls) < 4:\n            raise RuntimeError("temporary")\n        return {\n            "state": "OBSERVED",\n            "realized_sample_size": 1,\n            "decision_authority": False,\n            "execution_authority": False,\n        }\n\n    feed = RuntimeLearningOutcomeFeed(\n        wallet_outcome_observer=observer\n    )\n\n    first = close(\n        feed,\n        81,\n        0.25,\n        opening_context=verified_context(),\n    )\n\n    assert first["payload"]["phase9_wallet_tracking"]["state"] == "DEGRADED"\n    assert feed.phase9_retry_count == 1\n\n    a = feed.retry_degraded_wallet_outcomes()\n    b = feed.retry_degraded_wallet_outcomes()\n    c = feed.retry_degraded_wallet_outcomes()\n\n    assert a[0]["phase9_wallet_tracking"]["state"] == "DEGRADED"\n    assert b[0]["phase9_wallet_tracking"]["state"] == "DEGRADED"\n    assert c[0]["phase9_wallet_tracking"]["state"] == "OBSERVED"\n    assert len(calls) == 4\n    assert feed.phase9_retry_count == 0\n    assert feed.event_snapshot()[0]["phase9_wallet_tracking"]["state"] == "OBSERVED"\n    assert feed.accepted_count == 1\n    assert feed.duplicate_count == 0\n\n\ndef test_phase9_retry_queue_is_bounded_with_event_store():\n    def observer(*args, **kwargs):\n        raise RuntimeError("temporary")\n\n    feed = RuntimeLearningOutcomeFeed(\n        max_events=2,\n        wallet_outcome_observer=observer,\n    )\n\n    for position_id in (91, 92, 93):\n        close(\n            feed,\n            position_id,\n            0.10,\n            opening_context=verified_context(),\n        )\n\n    assert feed.event_count == 2\n    assert feed.phase9_retry_count == 2\n    assert feed.status()["max_phase9_retries"] == 2\n'''
          if 'test_degraded_phase9_retry_queue_survives_multiple_scheduler_passes' not in text:
              text += extra
          runtime_test.write_text(text, encoding='utf-8')

          manager_test = Path('tests/test_paper_manager.py')
          text = manager_test.read_text(encoding='utf-8')
          extra = '''\n\ndef test_replay_retries_phase9_degraded_queue_without_new_closed_rows():\n    class RetryFeed:\n        def __init__(self):\n            self.calls = 0\n\n        def retry_degraded_wallet_outcomes(self, *, limit=8):\n            self.calls += 1\n            assert limit == 8\n            return [{\n                "state": "PHASE9_RETRY",\n                "phase9_wallet_tracking": {"state": "DEGRADED"},\n            }]\n\n    class RetryDB:\n        def __init__(self):\n            self.after_ids = []\n\n        def closed_positions(self, *, after_id=0):\n            self.after_ids.append(after_id)\n            return []\n\n    manager = PaperManager.__new__(PaperManager)\n    manager.learning_feed = RetryFeed()\n    manager.db = RetryDB()\n    manager._learning_replay_after_id = 99\n\n    first = manager.replay_closed_outcomes()\n    second = manager.replay_closed_outcomes()\n\n    assert manager.learning_feed.calls == 2\n    assert manager.db.after_ids == [99, 99]\n    assert manager._learning_replay_after_id == 99\n    assert len(first) == 1\n    assert len(second) == 1\n'''
          if 'test_replay_retries_phase9_degraded_queue_without_new_closed_rows' not in text:
              text += extra
          manager_test.write_text(text, encoding='utf-8')
          PY
      - name: Static guards
        run: |
          git diff --check
          python -m py_compile app/learning/runtime_outcome_feed.py app/paper/manager.py
      - name: Focused Phase 9 retry regression
        run: >-
          python -m pytest -q
          tests/test_runtime_outcome_feed.py
          tests/test_paper_manager.py
          tests/test_intelligence_composition.py
          tests/test_phase9_outcome_binding.py
          tests/test_phase9_successful_wallet_tracking.py
      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/phase9-degraded-retry-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/learning/runtime_outcome_feed.py app/paper/manager.py tests/test_runtime_outcome_feed.py tests/test_paper_manager.py
          git diff --cached --check
          git commit -m "fix: retain degraded Phase 9 wallet outcome retries"
          git push origin HEAD:phase9/successful-wallet-outcome-feed
