name: Phase 9 review hardening once

on:
  push:
    branches:
      - phase9/successful-wallet-outcome-feed

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9/successful-wallet-outcome-feed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply Phase 9 review hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ANCHOR_MISMATCH:{path}:{count}:{old[:80]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          intelligence = 'app/pipeline/intelligence_composition.py'
          replace_once(
              intelligence,
              'from app.dex.market_quality import analyze_market_quality\n',
              'from threading import RLock\n\nfrom app.dex.market_quality import analyze_market_quality\n',
          )
          replace_once(
              intelligence,
              '''        self.wallet_tracking = (\n            wallet_tracking\n            or WalletTrackingComposition()\n        )\n\n        self.adversary_readmodel = AdversaryReadModel(\n''',
              '''        self.wallet_tracking = (\n            wallet_tracking\n            or WalletTrackingComposition()\n        )\n        self._wallet_lock = RLock()\n\n        self.adversary_readmodel = AdversaryReadModel(\n''',
          )

          old_methods = '''    def update_wallet(\n        self,\n        wallet_id,\n        payload,\n    ):\n        payload = dict(payload or {})\n        normalized_wallet_id = str(\n            wallet_id or \"\"\n        ).strip().lower()\n\n        identity_source = str(\n            payload.get(\"identity_source\") or \"\"\n        ).strip().upper()\n\n        if (\n            normalized_wallet_id\n            and identity_source\n            == \"TRANSACTION_FROM_ONLY\"\n            and str(\n                payload.get(\"wallet_id\") or \"\"\n            ).strip().lower()\n            == normalized_wallet_id\n        ):\n            payload[\"phase9_wallet_tracking\"] = (\n                self.wallet_tracking.snapshot(\n                    normalized_wallet_id\n                )\n            )\n\n        return self.wallet_readmodel.put(\n            normalized_wallet_id,\n            payload,\n        )\n\n    def observe_wallet_outcome(\n        self,\n        wallet_id,\n        token_id,\n        return_pct,\n        *,\n        realized=False,\n    ):\n        result = self.wallet_tracking.observe_outcome(\n            wallet_id,\n            token_id,\n            return_pct,\n            realized=realized,\n        )\n\n        normalized_wallet_id = str(\n            wallet_id or \"\"\n        ).strip().lower()\n\n        current = (\n            self.wallet_readmodel.get(\n                normalized_wallet_id\n            )\n            if normalized_wallet_id\n            else {\"state\": \"UNKNOWN\", \"payload\": None}\n        )\n\n        payload = current.get(\"payload\")\n\n        if isinstance(payload, dict):\n            identity_source = str(\n                payload.get(\"identity_source\") or \"\"\n            ).strip().upper()\n\n            payload_wallet = str(\n                payload.get(\"wallet_id\") or \"\"\n            ).strip().lower()\n\n            if (\n                identity_source == \"TRANSACTION_FROM_ONLY\"\n                and payload_wallet == normalized_wallet_id\n            ):\n                self.update_wallet(\n                    normalized_wallet_id,\n                    payload,\n                )\n\n        return result\n\n    def observe_wallet_holding(\n        self,\n        wallet_id,\n        token_id,\n        balance,\n        *,\n        value_usd=None,\n        observed_at=None,\n    ):\n        return self.wallet_tracking.observe_holding(\n            wallet_id,\n            token_id,\n            balance,\n            value_usd=value_usd,\n            observed_at=observed_at,\n        )\n\n    def wallet_tracking_snapshot(\n        self,\n        wallet_id,\n    ):\n        return self.wallet_tracking.snapshot(\n            wallet_id\n        )\n\n'''
          new_methods = '''    def update_wallet(\n        self,\n        wallet_id,\n        payload,\n    ):\n        with self._wallet_lock:\n            payload = dict(payload or {})\n            normalized_wallet_id = str(\n                wallet_id or \"\"\n            ).strip().lower()\n\n            identity_source = str(\n                payload.get(\"identity_source\") or \"\"\n            ).strip().upper()\n\n            if (\n                normalized_wallet_id\n                and identity_source\n                == \"TRANSACTION_FROM_ONLY\"\n                and str(\n                    payload.get(\"wallet_id\") or \"\"\n                ).strip().lower()\n                == normalized_wallet_id\n            ):\n                payload[\"phase9_wallet_tracking\"] = (\n                    self.wallet_tracking.snapshot(\n                        normalized_wallet_id\n                    )\n                )\n\n            return self.wallet_readmodel.put(\n                normalized_wallet_id,\n                payload,\n            )\n\n    def observe_wallet_outcome(\n        self,\n        wallet_id,\n        token_id,\n        return_pct,\n        *,\n        realized=False,\n    ):\n        with self._wallet_lock:\n            result = self.wallet_tracking.observe_outcome(\n                wallet_id,\n                token_id,\n                return_pct,\n                realized=realized,\n            )\n\n            normalized_wallet_id = str(\n                wallet_id or \"\"\n            ).strip().lower()\n\n            current = (\n                self.wallet_readmodel.get(\n                    normalized_wallet_id\n                )\n                if normalized_wallet_id\n                else {\"state\": \"UNKNOWN\", \"payload\": None}\n            )\n\n            payload = current.get(\"payload\")\n\n            if isinstance(payload, dict):\n                identity_source = str(\n                    payload.get(\"identity_source\") or \"\"\n                ).strip().upper()\n\n                payload_wallet = str(\n                    payload.get(\"wallet_id\") or \"\"\n                ).strip().lower()\n\n                if (\n                    identity_source == \"TRANSACTION_FROM_ONLY\"\n                    and payload_wallet == normalized_wallet_id\n                ):\n                    self.update_wallet(\n                        normalized_wallet_id,\n                        payload,\n                    )\n\n            return result\n\n    def observe_wallet_holding(\n        self,\n        wallet_id,\n        token_id,\n        balance,\n        *,\n        value_usd=None,\n        observed_at=None,\n    ):\n        with self._wallet_lock:\n            return self.wallet_tracking.observe_holding(\n                wallet_id,\n                token_id,\n                balance,\n                value_usd=value_usd,\n                observed_at=observed_at,\n            )\n\n    def wallet_tracking_snapshot(\n        self,\n        wallet_id,\n    ):\n        with self._wallet_lock:\n            return self.wallet_tracking.snapshot(\n                wallet_id\n            )\n\n'''
          replace_once(intelligence, old_methods, new_methods)

          outcome = 'app/learning/runtime_outcome_feed.py'
          old_duplicate = '''        if outcome_id in self._events:\n            self.duplicate_count += 1\n\n            return self._out(\n                \"DUPLICATE\",\n                self._events[\n                    outcome_id\n                ],\n            )\n'''
          new_duplicate = '''        if outcome_id in self._events:\n            self.duplicate_count += 1\n            existing = self._events[outcome_id]\n            phase9 = existing.get(\n                \"phase9_wallet_tracking\"\n            )\n\n            if (\n                isinstance(phase9, dict)\n                and phase9.get(\"state\") == \"DEGRADED\"\n            ):\n                existing[\n                    \"phase9_wallet_tracking\"\n                ] = self._observe_phase9_wallet_outcome(\n                    position_id=position_id,\n                    opening_context=opening_context,\n                    realized_return=realized_return,\n                    evidence_complete=bool(\n                        observed_at\n                        and evaluated_at\n                        and token\n                        and realized_return is not None\n                    ),\n                )\n\n            return self._out(\n                \"DUPLICATE\",\n                existing,\n            )\n'''
          replace_once(outcome, old_duplicate, new_duplicate)

          runtime_test = Path('tests/test_runtime_outcome_feed.py')
          text = runtime_test.read_text(encoding='utf-8')
          extra = '''\n\ndef test_degraded_phase9_observer_retries_on_duplicate_replay():\n    calls = []\n\n    def observer(wallet_id, outcome_id, return_pct, *, realized=False):\n        calls.append((wallet_id, outcome_id, return_pct, realized))\n        if len(calls) == 1:\n            raise RuntimeError("temporary")\n        return {\n            "state": "OBSERVED",\n            "realized_sample_size": 1,\n            "decision_authority": False,\n            "execution_authority": False,\n        }\n\n    feed = RuntimeLearningOutcomeFeed(\n        wallet_outcome_observer=observer\n    )\n\n    first = close(\n        feed,\n        71,\n        0.20,\n        opening_context=verified_context(),\n    )\n    second = close(\n        feed,\n        71,\n        0.20,\n        opening_context=verified_context(),\n    )\n\n    assert first["state"] == "OBSERVED"\n    assert first["payload"]["phase9_wallet_tracking"]["state"] == "OBSERVED"\n    assert second["state"] == "DUPLICATE"\n    assert second["payload"]["phase9_wallet_tracking"]["state"] == "OBSERVED"\n    assert len(calls) == 2\n    assert calls[0][1] == calls[1][1] == "paper-position:71"\n    assert feed.event_count == 1\n    assert feed.accepted_count == 1\n    assert feed.duplicate_count == 1\n'''
          if 'test_degraded_phase9_observer_retries_on_duplicate_replay' not in text:
              text += extra
          runtime_test.write_text(text, encoding='utf-8')

          intel_test = Path('tests/test_intelligence_composition.py')
          text = intel_test.read_text(encoding='utf-8')
          extra = '''\n\ndef test_wallet_tracking_updates_are_serialized_across_threads():\n    import threading\n    import time\n\n    class GuardedTracking:\n        def __init__(self):\n            self.active = 0\n            self.overlap = False\n            self.guard = threading.Lock()\n\n        def _enter(self):\n            with self.guard:\n                self.active += 1\n                if self.active > 1:\n                    self.overlap = True\n            time.sleep(0.02)\n\n        def _exit(self):\n            with self.guard:\n                self.active -= 1\n\n        def snapshot(self, wallet_id):\n            self._enter()\n            try:\n                return {\n                    "state": "READY",\n                    "wallet_id": wallet_id,\n                    "performance": {"state": "OBSERVED"},\n                }\n            finally:\n                self._exit()\n\n        def observe_outcome(self, wallet_id, token_id, return_pct, *, realized=False):\n            self._enter()\n            try:\n                return {\n                    "state": "OBSERVED",\n                    "wallet_id": wallet_id,\n                    "realized_sample_size": 1,\n                    "decision_authority": False,\n                    "execution_authority": False,\n                }\n            finally:\n                self._exit()\n\n        def observe_holding(self, *args, **kwargs):\n            self._enter()\n            try:\n                return {"state": "READY"}\n            finally:\n                self._exit()\n\n    tracking = GuardedTracking()\n    c = RuntimeIntelligenceComposition(wallet_tracking=tracking)\n    wallet = "bsc:0xabc"\n    payload = {\n        "wallet_id": wallet,\n        "identity_source": "TRANSACTION_FROM_ONLY",\n        "wallet_context_ready": True,\n    }\n    c.update_wallet(wallet, payload)\n\n    barrier = threading.Barrier(3)\n    errors = []\n\n    def update():\n        try:\n            barrier.wait()\n            c.update_wallet(wallet, payload)\n        except Exception as exc:\n            errors.append(exc)\n\n    def outcome():\n        try:\n            barrier.wait()\n            c.observe_wallet_outcome(\n                wallet,\n                "paper-position:threaded",\n                10.0,\n                realized=True,\n            )\n        except Exception as exc:\n            errors.append(exc)\n\n    a = threading.Thread(target=update)\n    b = threading.Thread(target=outcome)\n    a.start()\n    b.start()\n    barrier.wait()\n    a.join(timeout=2)\n    b.join(timeout=2)\n\n    assert not a.is_alive()\n    assert not b.is_alive()\n    assert errors == []\n    assert tracking.overlap is False\n'''
          if 'test_wallet_tracking_updates_are_serialized_across_threads' not in text:
              text += extra
          intel_test.write_text(text, encoding='utf-8')
          PY
      - name: Static guards
        run: |
          git diff --check
          python -m py_compile app/learning/runtime_outcome_feed.py app/pipeline/intelligence_composition.py
      - name: Focused Phase 9 regression
        run: >-
          python -m pytest -q
          tests/test_runtime_outcome_feed.py
          tests/test_intelligence_composition.py
          tests/test_phase9_outcome_binding.py
          tests/test_phase9_successful_wallet_tracking.py
      - name: Commit validated hardening and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/phase9-review-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/learning/runtime_outcome_feed.py app/pipeline/intelligence_composition.py tests/test_runtime_outcome_feed.py tests/test_intelligence_composition.py
          git diff --cached --check
          git commit -m "fix: harden Phase 9 wallet outcome feed review findings"
          git push origin HEAD:phase9/successful-wallet-outcome-feed
